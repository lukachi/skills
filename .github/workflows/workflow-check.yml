name: wfctl check

on:
  push:
    branches: ["**"]
    paths: ["workflow/**", ".github/workflows/workflow-check.yml"]
  pull_request:
    paths: ["workflow/**", ".github/workflows/workflow-check.yml"]

defaults:
  run:
    working-directory: workflow

jobs:
  deterministic:
    name: Types, unit tests, bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build bundle
        run: bun run build
      # dist/cli.js is committed and shipped. `bun run build` overwrites it, so
      # without this step a stale bundle would be silently repaired in CI and
      # never reported.
      - name: Reject stale committed bundle
        run: git diff --exit-code -- dist/cli.js templates/skill/wfctl/references/commands.md

  integration:
    name: Graphify integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Install Graphify
        run: uv tool install graphifyy
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Graphify integration
        run: bun run test:graphify
